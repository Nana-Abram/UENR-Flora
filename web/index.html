<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="plantid_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>plantid_app</title>
  <link rel="manifest" href="manifest.json">
  <!--
    Required by supabase_flutter's transitive `passkeys` dependency: its web
    plugin registrant unconditionally initializes the passkeys JS SDK during
    bootstrap (even though this app doesn't use passkey auth), and throws an
    uncaught error that crashes the whole app before runApp() if this script
    is missing. Hosted locally (vendored from the corbado/flutter-passkeys
    2.4.0 release) instead of fetched from GitHub at load time, since that
    external fetch was unreliable and would intermittently crash the app on
    page load when it failed.
  -->
  <script src="passkeys_bundle.js"></script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
