<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">

  <!--
    Without this, mobile browsers assume a ~980px desktop viewport and
    scale the whole page down to fit — the app would render tiny and need
    pinch-zoom just to use, on exactly the phones this install target is
    for. Verified live at a 390px mobile viewport: content now fills the
    screen at 1:1 scale instead of rendering as a shrunk desktop layout.

    Deliberately written without user-scalable=no/maximum-scale=1 here —
    but note the Flutter web engine (compiled into main.dart.js) overwrites
    this tag at runtime and sets both anyway, to keep native browser
    pinch-zoom from fighting its own canvas coordinate/gesture system. That
    engine behavior isn't controllable from project-level files, so this
    tag's real effect is limited to the brief pre-engine-boot paint — kept
    permissive anyway on the chance a future engine version defers to it.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!--
    Every script this app loads is vendored locally — passkeys_bundle.js,
    tfjs.min.js, classifier.js, share.js, speech.js, connectivity.js, and
    (as of the --no-web-resources-cdn build flag, see README.md) Flutter's
    own CanvasKit renderer too, served from build/web/canvaskit/ instead of
    https://www.gstatic.com. That CDN dependency used to be required here
    and is deliberately NOT allowlisted anymore: a hung/blocked fetch to it
    was traced live to a permanently blank page with zero console errors —
    the exact failure this policy would otherwise need to tolerate forever.
    Building without --no-web-resources-cdn will silently reintroduce that
    single point of failure even though nothing here would flag it.
    script-src is otherwise restricted to 'self' to block a real class of
    future XSS (a script tag injected via some future innerHTML/templating
    bug can't execute from an arbitrary host — 'unsafe-inline' below does
    NOT reopen that: it only permits inline <script>...</script> content
    and inline event handlers, not <script src="https://foreign-host/...">,
    which 'self' still blocks regardless). Other directives (img-src,
    connect-src, etc.) are intentionally left unrestricted since this app
    talks to Supabase's storage/API on a different origin.

    'wasm-unsafe-eval' is needed for CanvasKit's WebAssembly compilation.
    'unsafe-eval' is separately required by tfjs.min.js, which does a plain
    string-eval during its own setup — without it, window.tf loads as an
    empty object and every real scan silently fails with a generic
    "Something went wrong" error while the Scan screen itself still renders
    fine, which is how that went unnoticed for a while. Verified live
    (headless browser, real classify() call against the actual model) that
    'unsafe-eval' fixes it.

    'unsafe-inline' was added after `flutter run -d chrome` came up as a
    fully blank page with zero errors in the terminal — the *only* signal
    was a CSP violation logged to the browser console (not the terminal):
    "Executing inline script violates ... script-src". DWDS's dev-mode
    bootstrap (DDC's module loader, only present in debug/`flutter run`
    builds — a release build's flutter_bootstrap.js never does this)
    injects a small inline <script> block, and it embeds this session's
    random debug-service port, so it's a *different* script body (and
    thus a different CSP hash) every single `flutter run`, making a
    one-off 'sha256-...' allowlist entry useless beyond the one session
    that produced it. Given 'unsafe-eval' already lets injected code run
    via eval() of a string, permitting inline <script> tags too is a
    modest incremental relaxation, not a new category of risk — the
    "no foreign-host scripts" protection above is what actually mattered
    and is unchanged.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval' 'unsafe-inline'; object-src 'none';">

  <meta name="description"
        content="AI-based plant identification and environmental awareness for the University of Energy and Natural Resources campus.">

  <!--
    Tints the browser chrome (Android Chrome's toolbar, the task-switcher
    card header) to match the app's own kDeep hero color, both before and
    after "Add to Home Screen" — manifest.json's theme_color only applies
    once installed, this applies immediately in-tab too.
  -->
  <meta name="theme-color" content="#1A3C2D">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="UENR Flora">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!--
    Splash screen styling — deliberately inline here (not in a linked .css
    file) so it applies on the very first paint, before any extra network
    request. #uenr-splash itself lives at the top of <body> (see below);
    the background color here also covers the sliver of blank canvas that
    would otherwise flash between "HTML parsed" and "splash div painted."
  -->
  <style>
    html, body { background: #1A3C2D; }
    #uenr-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #1A3C2D;
      transition: opacity 0.35s ease;
    }
    #uenr-splash.uenr-splash-hide { opacity: 0; pointer-events: none; }
    #uenr-splash .uenr-splash-badge {
      width: 64px; height: 64px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      display: flex; align-items: center; justify-content: center;
      font-size: 30px; margin-bottom: 16px;
    }
    #uenr-splash .uenr-splash-title {
      color: #fff; font-size: 20px; font-weight: 600; letter-spacing: 0.2px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #uenr-splash .uenr-splash-spinner {
      margin-top: 22px; width: 26px; height: 26px;
      border: 3px solid rgba(255, 255, 255, 0.25); border-top-color: #fff;
      border-radius: 50%; animation: uenr-splash-spin 0.8s linear infinite;
    }
    @keyframes uenr-splash-spin { to { transform: rotate(360deg); } }
  </style>

  <title>UENR Flora</title>
  <link rel="manifest" href="manifest.json">
  <!--
    Required by supabase_flutter's transitive `passkeys` dependency: its web
    plugin registrant unconditionally initializes the passkeys JS SDK during
    bootstrap (even though this app doesn't use passkey auth), and throws an
    uncaught error that crashes the whole app before runApp() if this script
    is missing. Hosted locally (vendored from the corbado/flutter-passkeys
    2.4.0 release) instead of fetched from GitHub at load time, since that
    external fetch was unreliable and would intermittently crash the app on
    page load when it failed.
  -->
  <!--
    All seven scripts below are `defer` rather than plain/blocking tags, so
    none of them hold up HTML parsing on every route just to be ready for
    the scan screen. `defer` (unlike `async`) guarantees they still run in
    this exact document order, right before DOMContentLoaded — which
    matters because passkeys_bundle.js's registrant genuinely must finish
    running before flutter_bootstrap.js starts the app (see its comment
    below). Mixing in `async` here instead would NOT preserve that order
    and could reintroduce the crash-before-runApp() failure this comment
    warns about.
  -->
  <script src="passkeys_bundle.js" defer></script>

  <!--
    Deliberately placed here — right after passkeys_bundle.js (the one
    script that genuinely must run before Flutter's plugin registration,
    see its comment above) and before every other vendored script below.
    `defer` scripts execute in strict document order, each one blocking the
    next until it has both downloaded AND run — so with flutter_bootstrap.js
    listed last (as `flutter build web` generates it by default), Flutter's
    own boot (fetching CanvasKit + main.dart.js) couldn't even start until
    tfjs.min.js (1.4MB) and the five scripts after it had all finished
    downloading first, even though none of them are needed until well after
    main.dart.js itself has loaded. Moving this tag up lets
    `_flutter.loader.load()` (inside flutter_bootstrap.js) kick off those
    fetches immediately in parallel with the rest, instead of queued behind
    them — verified via web/index.html's splash screen sitting up
    noticeably longer than it needed to with the old ordering. See also
    main.dart's _AppBootstrap, which defers the *model* downloads
    (tfjs-dependent, not just the script) to after first frame for the same
    reason.
  -->
  <script src="flutter_bootstrap.js" defer></script>

  <!--
    Species/health classifier. Vendored locally (npm @tensorflow/tfjs
    4.22.0, matching the converter version that produced
    assets/models/model.json) rather than pulled from a CDN, for the same
    reliability reason as passkeys_bundle.js above. classifier.js defines
    window.uenrFlora, called from lib/services/tfjs_classifier_service.dart.
  -->
  <script src="tfjs.min.js" defer></script>
  <script src="classifier.js" defer></script>

  <!--
    Binary plant/not-plant "gate" model — screens a photo before it ever
    reaches the 76-class species model above. Defines window.uenrFloraGate,
    called from lib/features/scan/services/gate_classifier_service.dart.
  -->
  <script src="gate_classifier.js" defer></script>

  <!--
    Native share-sheet wrapper (Web Share API) with a clipboard fallback.
    Defines window.uenrShare, called from
    lib/services/web_share_service.dart.
  -->
  <script src="share.js" defer></script>

  <!--
    Read-aloud wrapper (Web Speech API's speechSynthesis). Defines
    window.uenrSpeech, called from lib/services/web_speech_service.dart.
  -->
  <script src="speech.js" defer></script>

  <!--
    navigator.onLine + online/offline event wrapper. Defines
    window.uenrConnectivity, called from
    lib/services/connectivity_service.dart.
  -->
  <script src="connectivity.js" defer></script>

  <!--
    Web Push subscribe/unsubscribe bridge. Defines window.uenrPush, called
    from lib/services/web_push_service.dart. push.js registers push_sw.js
    (the service worker that actually receives push messages) itself,
    independent of Flutter's own bootstrap — see push.js's and push_sw.js's
    own comments for why.
  -->
  <script src="push.js" defer></script>

  <!--
    Downscales a photo before it's uploaded to the background-identify
    edge function (hidden Gemini/Claude "second opinion" layer — see
    lib/features/scan/services/background_identifier_service.dart).
    Defines window.uenrImageResize.
  -->
  <script src="image_resize.js" defer></script>
</head>
<body>
  <!--
    Shown instantly (plain HTML/CSS, no JS or network dependency) while
    CanvasKit/main.dart.js/the model download and the engine boots — without
    this the page is just a blank #1A3C2D rectangle for that whole window,
    which reads as "did this load at all?" on a slow connection. Removed by
    the inline script below on Flutter's own 'flutter-first-frame' event —
    see https://docs.flutter.dev/platform-integration/web/initialization —
    rather than a fixed delay, so it always tracks the real boot time
    instead of guessing it.
  -->
  <div id="uenr-splash">
    <div class="uenr-splash-badge">🌿</div>
    <div class="uenr-splash-title">UENR Flora</div>
    <div class="uenr-splash-spinner"></div>
  </div>
  <script>
    (function () {
      var removed = false;
      function removeSplash() {
        if (removed) return;
        removed = true;
        var el = document.getElementById('uenr-splash');
        if (!el) return;
        el.classList.add('uenr-splash-hide');
        setTimeout(function () { el.remove(); }, 400);
      }
      window.addEventListener('flutter-first-frame', removeSplash);
      // Safety net: if boot fails before ever painting a first frame (a
      // crash, a blocked asset), the event above never fires — without this
      // the splash would sit on screen forever hiding whatever error state
      // main.dart.js did manage to render underneath it.
      setTimeout(removeSplash, 10000);
    })();
  </script>
</body>
</html>
