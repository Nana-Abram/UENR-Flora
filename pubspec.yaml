name: plantid_app
description: AI-based Plant Species Identification & Environmental Awareness System for UENR.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.6
  go_router: ^14.2.0
  provider: ^6.1.2
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  shared_preferences: ^2.3.0
  flutter_dotenv: ^5.2.1
  fl_chart: ^0.69.0
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/models/gate/
    - assets/images/
    - assets/images/hero_carousel/
    - .env
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
